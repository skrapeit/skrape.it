[versions]
agp = "9.4.1"
androidxActivity = "1.13.0"
androidxAppcompat = "1.7.1"
androidxLifecycle = "2.11.0"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
coil = "2.7.0"
composeBom = "2026.09.00"
material = "1.13.0"
detekt = "2.0.0-alpha.6"
dokka = "2.2.0"
htmlunit = "2.63.0"
javaxServlet = "4.0.1"
jetbrainsAnnotations = "23.0.0"
jsoup = "1.23.2"
junit = "5.8.2"
kotlin = "2.4.21"
kotlinxCoroutines = "1.6.1"
ktor = "3.0.0-beta-1"
log4jOverSlf4j = "2.0.7"
logback = "1.3.11"
mavenPublishPlugin = "0.34.0"
mockk = "1.14.11"
okhttp = "5.5.0"
restAssured = "4.4.0"
spring = "5.3.13"
strikt = "0.33.0"
testContainers = "2.0.5"
testLogger = "4.0.0"
versionCatalogUpdate = "1.0.1"
versionsFilterPlugin = "0.1.16"
versionsPlugin = "0.53.0"
wireMock = "2.28.0"

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
mavenPublishPlugin = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublishPlugin" }
testLogger = { id = "com.adarshr.test-logger", version.ref = "testLogger" }
versionCatalogUpdate = { id = "nl.littlerobots.version-catalog-update", version.ref = "versionCatalogUpdate" }
versionsFilterPlugin = { id = "se.ascp.gradle.gradle-versions-filter", version.ref = "versionsFilterPlugin" }
versionsPlugin = { id = "com.github.ben-manes.versions", version.ref = "versionsPlugin" }

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
