coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material = { module = "androidx.compose.material:material" }
compose-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }
htmlunit-android = { module = "net.sourceforge.htmlunit:htmlunit-android", version.ref = "htmlunit" }
javax-servlet-api = { module = "javax.servlet:javax.servlet-api", version.ref = "javaxServlet" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrainsAnnotations" }
