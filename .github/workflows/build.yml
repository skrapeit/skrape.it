name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        test-java-version: ["17", "25"]
        os:
          - ubuntu-latest
          - windows-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up build and test JDKs
        uses: actions/setup-java@v5
        with:
          # The last entry runs Gradle; testJavaVersion selects the actual test JVM.
          java-version: |
            17
            25
          distribution: "liberica"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle Wrapper
        # Docker-backed tests are skipped on Windows, so its coverage is not comparable to Ubuntu.
        run: ./gradlew build dokkaJavadocJar --stacktrace "-PtestJavaVersion=${{ matrix.test-java-version }}" "-Pkover.verify.warn=${{ runner.os == 'Windows' }}"

      - name: Add coverage report
        id: kover
        uses: mi-kas/kover-report@v1.9
        if: >-
          matrix.os == 'ubuntu-latest' &&
          matrix.test-java-version == '25' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        with:
          path: ${{ github.workspace }}/build/reports/kover/report.xml
          title: Code Coverage
          update-comment: true
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          coverage-counter-type: LINE

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.test-java-version == '25'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/kover/report.xml

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up build JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: liberica

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package is no longer available from Google's SDK repository.
          packages: platform-tools

      - name: Publish current library for the Android consumer
        run: ./gradlew publishToMavenLocal "-Dmaven.repo.local=$PWD/build/maven-smoke-test" --stacktrace

      - name: Build and lint the R8-optimized Android consumer
        run: ./gradlew -p examples/android :app:lintRelease :app:assembleRelease :app:assembleReleaseAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test published artifacts on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: ./gradlew -p examples/android :app:connectedReleaseAndroidTest --stacktrace

      - name: Require executed Android tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports = Path("examples/android/app/build/outputs/androidTest-results/connected/release").glob("TEST-*.xml")
          suites = [ET.parse(path).getroot() for path in reports]
          count = sum(int(suite.get("tests", 0)) for suite in suites)
          assert count >= 4, f"Expected at least 4 Android tests, found {count}"
          assert all(int(suite.get(key, 0)) == 0 for suite in suites for key in ("failures", "errors", "skipped"))
          print(f"Verified {count} Android tests")
          PY

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            examples/android/app/build/reports/
            examples/android/app/build/outputs/androidTest-results/
            examples/android/app/build/outputs/mapping/release/

  snapshot_release:
    needs: [build, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPEUSERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPEPASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEYID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGPASSWORD }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: previous_tag
        uses: WyriHaximus/github-action-get-previous-tag@v1
        with:
          fallback: 0.0.0

      - name: Create snapshot version
        id: version_by_fragment
        uses: christian-draeger/increment-semantic-version@1.2.3
        with:
          current-version: ${{ steps.previous_tag.outputs.tag }}
          version-fragment: minor

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "liberica"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Publish snapshot to Maven Central
        env:
          SNAPSHOT_VERSION: ${{ steps.version_by_fragment.outputs.next-version }}-SNAPSHOT
        run: |
          echo "Snapshot version: $SNAPSHOT_VERSION" >> "$GITHUB_STEP_SUMMARY"
          ./gradlew publishToMavenCentral "-PVERSION_NAME=$SNAPSHOT_VERSION" -PsignAllPublications=true --no-configuration-cache --stacktrace

  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "liberica"

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v5

  qodana:
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up analysis JDKs
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            25
          distribution: liberica

      - name: Run static code analysis
        uses: JetBrains/qodana-action@v2026.2.2
        with:
          # Keep both JDKs available while Qodana analyzes the PR base and head.
          args: --within-docker false
          upload-result: true

      - name: Upload static code analysis results
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
